name: A_Memorix Tests

on:
  pull_request:
    paths:
      - "src/A_memorix/**"
      - "src/services/memory_service.py"
      - "src/webui/routers/memory.py"
      - "pytests/A_memorix_test/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - ".github/workflows/a-memorix-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 安装项目依赖
        run: uv sync --frozen --group dev
      - name: 运行 A_Memorix 测试
        # 保留 `python -m pytest`：即使 pyproject 已配置 pythonpath，显式走模块入口
        # 也能确保仓库根目录进入 sys.path，避免收集阶段报 ModuleNotFoundError。
        # 注意：pytests/webui/test_memory_routes_integration.py 已由上游移除，
        # 不得再引用，否则工作流会因路径不存在直接失败。
        run: uv run python -m pytest -q pytests/A_memorix_test
