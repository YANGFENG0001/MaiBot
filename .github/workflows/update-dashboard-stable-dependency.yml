name: Update Dashboard Stable Dependency

on:
  workflow_run:
    workflows:
      - Publish WebUI Dist
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard-dependency-main
  cancel-in-progress: false

jobs:
  update-stable-dependency:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Wait for PyPI dashboard stable package
        run: |
          uv run --no-project --with packaging --with tomlkit python .github/scripts/update_dashboard_stable_dependency.py

      # pyproject.toml 一旦改动，uv.lock 就过期了。
      # Dockerfile 用 `uv sync --locked` 构建，lock 与 pyproject 不同步会让镜像构建
      # 直接失败（且失败点在 RUN uv sync，很难一眼看出是这里造成的）。
      # 所以每次改依赖都必须同步重算 lock。
      - name: Update dependency lock
        run: uv lock --upgrade-package maibot-dashboard

      - name: Verify lock is in sync
        run: uv lock --check

      - name: Commit dependency update
        run: |
          set -euo pipefail

          if git diff --quiet -- pyproject.toml requirements.txt uv.lock; then
            echo "没有发现 dashboard 正式版依赖更新"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml requirements.txt uv.lock
          git commit -m "chore: 更新 dashboard 正式版依赖"
          git pull --rebase origin main
          git push origin HEAD:main
