# SnowLuma 控制台反向代理（宿主机 nginx，对外监听 6099）
#
# 为什么要多这一层代理：
#   SnowLuma 控制台是单页应用（SPA），只有根路径 `/` 有效；而上一代协议端控制台的
#   路由（典型的是 /webui/web_login）还留在用户书签与浏览器历史里，直接访问会落到
#   SnowLuma 自己的 404 页「页面不存在」。容器本身没法拦截这些旧地址，
#   所以把对外 6099 交给 nginx：旧地址一律 302 回 `/`，其余原样反代。
#
#   注意：只改服务端挡不住浏览器里已经缓存过的旧页面 —— 如果打开旧地址仍然看到
#   上一代控制台的画面，需要在该站点上强制刷新（Ctrl+Shift+R）或清一次站点缓存。
#
# 部署：
#   cp nginx-snowluma-console.conf /etc/nginx/sites-available/snowluma-console
#   ln -sf /etc/nginx/sites-available/snowluma-console /etc/nginx/sites-enabled/snowluma-console
#   nginx -t && systemctl reload nginx
#
# 前置条件：docker-compose.snowluma.yml 里 SnowLuma 的 5099 必须只绑 127.0.0.1
#           （ports: "127.0.0.1:5099:5099"），否则会和本文件的 listen 6099 抢地址。
#
# 说明：Debian 的 nginx.conf 在 http{} 层 include /etc/nginx/sites-enabled/*，
#       所以本文件里的 map 与 server 都是 http 上下文的合法子句。

# WebSocket 升级头：只在真正是 WS 请求时才发 Connection: upgrade。
# 名字带 snowluma 前缀，避免与其它站点文件里的同名 map 冲突。
map $http_upgrade $snowluma_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 6099;
    listen [::]:6099;
    server_name _;

    # 上一代协议端控制台的路由前缀，SnowLuma 没有对应页面 —— 一律跳回根路径。
    # 显式声明 no-store，避免这条跳转本身又被浏览器缓存住。
    location ^~ /webui {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /;
    }

    location / {
        proxy_pass http://127.0.0.1:5099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 控制台用 WebSocket 推送实时状态，必须透传 Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $snowluma_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
